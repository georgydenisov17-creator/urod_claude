<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Урод</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="stylesheet" href="style.css">
</head>
<body class="menu">
<canvas id="c"></canvas>
<button id="snd" class="ib">🔊</button>

<div class="ctl l"><button data-k="brake">ТОРМОЗ</button><button data-k="gas" class="big">ГАЗ</button></div>
<div class="ctl r"><button data-k="wheelie">ВИЛИ</button><button data-k="jump" class="big">ПРЫЖОК</button></div>

<div id="start" class="scr">
  <h1>УРОД</h1>
  <p class="sub">Школьник на питбайке</p>
  <p class="info" id="sInfo"></p>
  <button class="btn" id="play">Играть</button>
  <button class="btn alt shopbtn">Магазин</button>
</div>

<div id="over" class="scr hide">
  <h2>Game Over</h2>
  <p class="info" id="oInfo"></p>
  <button class="btn" id="again">Заново</button>
  <button class="btn alt shopbtn">Магазин</button>
</div>

<div id="shop" class="scr hide">
  <h2>Магазин</h2>
  <p class="info" id="shInfo"></p>
  <div id="list"></div>
  <button class="btn alt" id="back">Назад</button>
</div>

<script src="game.js"></script>
</body>
</html>
